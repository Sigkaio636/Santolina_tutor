# vis-design seed decision: One measure per category as sorted horizontal bars
schema_version: 1
id: compare-values-across-categories--sorted-horizontal-bar
status: declared
title: One measure per category as sorted horizontal bars
problem:
  archetype: compare-values-across-categories
  catalog_functions:
  - comparisons
  statement: How does {measure} compare across {category}?
  mode: explanatory
  domain_examples:
  - burned area per region
  - revenue per product line
  - students per programme
user:
  profile: general-public
  modifiers: []
tasks:
  why:
    goal: present
    search: lookup
    query: compare
  low_level:
  - compare
  - find-extremum
  - sort
  - retrieve-value
  temporal: []
  shneiderman:
  - overview
data:
  dataset_type: table
  keys:
  - role: category
    type: categorical
    cardinality: some
  values:
  - role: measure
    type: quantitative
    semantics: amount
  items: tiny
constraints: []
solution:
  idiom: bar_chart
  family: bar
  mark: line
  encodings:
  - attribute: category
    channel: position-y
    scale: ordinal
    sort: measure desc
  - attribute: measure
    channel: length
    scale: linear
    zero: true
  - attribute: highlight
    channel: color-hue
    scale: nominal
  derived_data:
  - sum or count per category
  ordering: categories by measure descending; highlighted item named in the title
  color:
    purpose: highlight
    palette_type: neutral-accent
    suggested:
    - '#8c8c8c'
    - '#0072b2'
    cvd_safe: true
    second_cue: direct label
  text:
    title: takeaway
    axis_units: true
    direct_labels: true
    annotations:
    - value label at bar end
    source_line: true
  interaction:
    level: none
    default_state_answers_task: true
    intents: []
  layout:
    small_multiples: false
    facet_by: null
    aspect: wide
  rejected_alternatives:
  - idiom: pie_chart
    reason: angle comparison fails beyond 3–5 parts
    rule: IDM-PIE
  - idiom: dot_plot
    reason: differences are large enough for bars; zero baseline keeps ratios honest
    rule: EXP-08
  - idiom: radial_bar_chart
    reason: outer bars look longer
    rule: EXP-07
  validation:
    stage3_checks:
    - EXP-08
    - CMP-01
    - COL-03
    - SCL-12
    - TXT-01
    critique_skill: optional
  library_notes:
    altair: mark_bar with y sorted by -x; alt.condition for the accent
    matplotlib: barh on a sorted frame; ax.bar_label; spines off
    plotly: px.bar orientation='h' with category_orders; marker_color list
rationale: Length on a common baseline is the most accurate channel for comparing magnitudes; sorting makes extremum
  and rank immediate; one neutral hue plus one accent avoids a legend.
confidence: high
provenance:
  origin: seed
  author: vis-design
  created: '2026-11-07'
  updated: '2026-11-07'
  times_used: 0
  last_used: null
  supersedes: null
  sources:
  - Munzner 2014
  - Wilke 2019
