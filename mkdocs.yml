      - Practice set and hidden test: PRACTICE_SET.md
      - Challenge context: CHALLENGE_CONTEXT.md
      - Setup video summary: RESUMEN_QUALCOMM_UNO_Q.md
  - Research:
      - Paper vault:
          - Vault index: vault/papers/README.md
          - Questions across folders: vault/papers/_junctions.md
      - Topics:
          - Benchmarks: vault/papers/benchmarks/_synthesis.md
          - Surveys and model reports: vault/papers/surveys/_synthesis.md
          - Inference on the board: vault/papers/inference/_synthesis.md
          - Quantization: vault/papers/quantization/_synthesis.md
          - Pruning: vault/papers/pruning/_synthesis.md
          - Fine-tuning and distillation: vault/papers/finetuning_distillation/_synthesis.md
          - Tutoring and pedagogy: vault/papers/tutoring_pedagogy/_synthesis.md
          - Jev decision models: vault/papers/jev/_synthesis.md
  - Team:
      - Develop the project: DEVELOPING.md
      - Skills guide (interactive): SKILLS_GUIDE.html
      - Review status: review/index.md

exclude_docs: |
  .gitkeep
  vault/.obsidian/
  vault/.trash/
  vault/papers/**/parsed/
  *.pdf
  vault/papers/download.sh
  vault/papers/papers.tsv
  UPC Datathon*.txt
  review/status.yml
  review/findings/

theme:
  name: material
  language: en
  icon:
    logo: material/school-outline
  # Atkinson Hyperlegible: the font of the student app's easy-to-read switch.
  font:
    text: Atkinson Hyperlegible
    code: JetBrains Mono
  features:
    - navigation.tabs        # one tab per top-level section: the sidebar lists only that section
    - navigation.sections    # groups inside a tab show as titled blocks
    - navigation.indexes
    - navigation.path        # breadcrumbs above the page title
    - navigation.top
    - navigation.footer      # previous and next page at the bottom
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
