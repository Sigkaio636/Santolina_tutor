# vis-design seed decision: Composition at one moment as sorted bars with percentages
schema_version: 1
id: part-to-whole-single--sorted-bars-with-percent
status: declared
title: Composition at one moment as sorted bars with percentages
problem:
  archetype: part-to-whole-single
  catalog_functions:
  - proportions
  - part-to-a-whole
  statement: What share of {total} does each {category} take?
  mode: explanatory
  domain_examples:
  - budget by cost centre
  - energy mix by source
  - answers by survey option
user:
  profile: general-public
  modifiers: []
tasks:
  why:
    goal: present
    search: lookup
    query: identify
  low_level:
  - gist
  - retrieve-value
  - compare
  temporal: []
  shneiderman:
  - overview
data:
  dataset_type: table
  keys:
  - role: category
    type: categorical
    cardinality: few
  values:
  - role: measure
    type: quantitative
    semantics: share
    derived: true
    derivation: share = part / total
  items: tiny
constraints: []
solution:
  idiom: bar_chart
  family: bar
  mark: line
  encodings:
  - attribute: category
    channel: position-y
    scale: ordinal
    sort: measure desc
  - attribute: measure
    channel: length
    scale: linear
    zero: true
  - attribute: highlight
    channel: color-hue
    scale: nominal
  derived_data:
  - share per category; total stated in the subtitle
  ordering: descending by share
  color:
    purpose: highlight
    palette_type: neutral-accent
    suggested:
    - '#8c8c8c'
    - '#0072b2'
    cvd_safe: true
    second_cue: direct label
  text:
    title: takeaway
    axis_units: true
    direct_labels: true
    annotations:
    - percent label at bar end
    source_line: true
  interaction:
    level: none
    default_state_answers_task: true
    intents: []
  layout:
    small_multiples: false
    facet_by: null
    aspect: wide
  rejected_alternatives:
  - idiom: pie_chart
    reason: angles compare poorly once parts exceed 3 or are similar
    rule: IDM-PIE
  - idiom: donut_chart
    reason: same as pie
    rule: IDM-PIE
  - idiom: treemap
    reason: single level, few parts
    rule: EFF-02
  validation:
    stage3_checks:
    - IDM-PIE
    - EXP-05
    - CMP-01
    - TXT-01
    critique_skill: optional
  library_notes:
    altair: mark_bar with percentage text layer
    matplotlib: barh with bar_label fmt='%.0f%%'
    plotly: px.bar text_auto
rationale: Sorted bars with printed percentages answer both 'which part is largest' and 'how much' exactly; the
  whole is stated in text rather than drawn as a circle.
confidence: high
provenance:
  origin: seed
  author: vis-design
  created: '2026-11-07'
  updated: '2026-11-07'
  times_used: 0
  last_used: null
  supersedes: null
  sources:
  - Few 2004
  - Kosara & Skau 2016
