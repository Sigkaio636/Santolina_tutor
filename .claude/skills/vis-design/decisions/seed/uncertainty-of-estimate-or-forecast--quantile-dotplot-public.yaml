# vis-design seed decision: A prediction as twenty countable dots for a lay reader
schema_version: 1
id: uncertainty-of-estimate-or-forecast--quantile-dotplot-public
status: declared
title: A prediction as twenty countable dots for a lay reader
problem:
  archetype: uncertainty-of-estimate-or-forecast
  catalog_functions:
  - range
  - distribution
  statement: How likely is {measure} to pass {threshold}?
  mode: explanatory
  domain_examples:
  - arrival-time prediction for a bus
  - predicted delivery date of an order
  - expected rainfall for tomorrow
user:
  profile: general-public
  modifiers: []
tasks:
  why:
    goal: present
    search: lookup
    query: identify
  low_level:
  - determine-range
  - retrieve-value
  - gist
  temporal: []
  shneiderman:
  - overview
data:
  dataset_type: table
  keys: []
  values:
  - role: measure
    type: quantitative
    semantics: amount
  items: small
constraints:
- uncertainty
- static-only
solution:
  idiom: quantile_dotplot
  family: uncertainty
  mark: point
  encodings:
  - attribute: measure
    channel: position-x
    scale: linear
    zero: false
    note: one dot per quantile of the predictive distribution
  - attribute: derived
    channel: length
    scale: linear
    note: dots stacked in columns; column height = number of dots in the bin; no numeric axis
  - attribute: highlight
    channel: color-hue
    scale: nominal
    note: dots beyond the threshold in the accent colour
  derived_data:
  - 20 evenly spaced quantiles of the predictive distribution (2.5 %, 7.5 %, … 97.5 %)
  - bins as wide as one dot; number of dots on each side of the threshold
  ordering: along the measure axis
  color:
    purpose: highlight
    palette_type: neutral-accent
    suggested:
    - '#8c8c8c'
    - '#0072b2'
    cvd_safe: true
    second_cue: threshold line with a label
  text:
    title: takeaway
    axis_units: true
    direct_labels: true
    annotations:
    - 'subtitle: each dot = 1 in 20 chances'
    - count stated in words, e.g. 3 of 20 dots fall after the threshold
    - threshold line labelled with what it means for the reader
    source_line: true
  interaction:
    level: none
    default_state_answers_task: true
    intents: []
  layout:
    small_multiples: false
    facet_by: null
    aspect: wide
  rejected_alternatives:
  - idiom: error_bars
    reason: lay readers take the interval as a hard range or as the data spread
    rule: PUR-14
  - idiom: density_plot
    reason: a density axis has no meaning for this reader; areas cannot be counted
    rule: PUR-14
  - idiom: bar_chart
    reason: a single predicted value hides the chance of the bad outcome
    rule: DAT-03
  - idiom: hypothetical_outcome_plot
    reason: needs animation; the output is static
    rule: CMP-08
  validation:
    stage3_checks:
    - PUR-14
    - DAT-03
    - TXT-07
    - TXT-02
    critique_skill: optional
  library_notes:
    altair: compute the quantiles in pandas, bin them, rank within bin (transform_window) and draw mark_circle with
      y = rank, axis=None on y; mark_rule + mark_text for the threshold
    matplotlib: np.quantile, np.digitize, then scatter(bin centre, stack index) with equal aspect; axvline for the
      threshold; hide the y axis
    plotly: same precomputed x and stack index in go.Scatter(mode='markers'); add_vline for the threshold; hide
      the y axis
rationale: Counting dots turns a probability into a frequency (3 in 20), which people without statistical training
  handle better than intervals or densities, and it led to better decisions about waiting in transit predictions
  (Kay et al. 2016; Fernandes et al. 2018). The dots must not sit beside raw-data dots, and one sentence says what
  a dot is.
confidence: high
provenance:
  origin: seed
  author: vis-design
  created: '2026-11-13'
  updated: '2026-11-13'
  times_used: 0
  last_used: null
  supersedes: null
  sources:
  - Kay et al. 2016
  - Fernandes et al. 2018
  - Padilla, Kay & Hullman 2021
