# User profile: Student or learner
id: student-learner
name: Student or learner
summary: Is learning the domain or the chart type at the same time. Reads for minutes, benefits from canonical
  idioms, explicit encoding explanations, annotations and one idea per chart.
capabilities:
  vis_literacy: low
  domain_knowledge: low
  statistical_literacy: low
  time_per_chart: minutes
  interaction_tolerance: low
  working_memory_budget: 3
  learned_idioms:
  - bar
  - line
  - pie
  - scatter
  - histogram
  - table
  - map-choropleth
  needs_explanation:
  - heatmap
  - distribution
  - parallel
  - network
  - stacked-area
  - slope
  - treemap
cognitive_tasks:
  why:
    goal: enjoy
    search: browse
    query: identify
  low_level_primary:
  - retrieve-value
  - compare
  - sort
  - trend
  low_level_secondary:
  - find-extremum
  - gist
  - characterize-distribution
  shneiderman:
  - overview
  - details-on-demand
text_needs:
  title_style: takeaway
  annotation_density: high
  needs_units_and_n: true
confidence_needs:
- source
- what-the-numbers-mean
- units
default_mode: explanatory
default_modifiers: []
avoid:
- pie-over-5
- dual-axes
- parallel
- network
- radial
- word-cloud
prefer_families:
- bar
- line
- scatter
- histogram
- small-multiples
- dot-plot
typical_readers:
- undergraduate reading course material
- newcomer to a team's metrics
- textbook reader
