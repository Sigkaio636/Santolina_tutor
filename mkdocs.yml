site_name: Santolina tutor
site_description: Math on the Edge copilot for the Arduino UNO Q (Qualcomm challenge)
docs_dir: docs
site_dir: site  # ignored by .gitignore (/site)
dev_addr: 127.0.0.1:8001  # 8000 is the board explorer (docs/BOARD_SETUP.md)

# The menu is in reading order. Add each new page here (see the docs-site skill).
nav:
  - Home: index.md
  - Get started:
      - Set up the board: BOARD_SETUP.md
      - Deploy the copilot: how-to/deploy-copilot-on-board.md
      - Use the student app: how-to/use-student-app.md
      - Run the teacher app: how-to/run-teacher-app.md
      - Answer and measure problems: how-to/use-copilot-on-board.md
  - Guides:
      - The board:
          - Back up and restore a board: how-to/back-up-and-restore-a-board.md
          - Time a 2B model: how-to/time-2b-model-on-board.md
      - Solvers and models:
          - Try the prior solver: how-to/try-prior-solver.md
          - Install decider-0.8b: how-to/install-decider-0.8b.md
          - Use decider-2b as router: how-to/use-decider-2b-router.md
      - Data:
          - Read the answer options: OPTION_READER_GUIDE.md
          - Extract papers with MinerU: how-to/mineru-ocr-papers.md
  - Reference:
      - The board:
          - UNO Q board reference: UNO_Q_BOARD_REFERENCE.md
          - Board limits (interactive): GUIA_RESTRICCIONES_UNOQ.html
          - LED matrix design: LED_MATRIX_DESIGN.md
          - Board data contract: reference/board-data-contract.md
      - The tutor:
          - Tutor response types: TUTOR_RESPONSE_TYPES.md
          - Message classifier prompt: TOOL_CALLER_PROMPT.md
          - "Student data and privacy": explanation/student-data-privacy.md
      - Models:
          - The tutor fine-tune: models/qwen35-tutor.md
          - decider-2b-vision: models/decider-2b-vision.md
          - InternVL3.5-1B: models/internvl3.5-1b.md
      - Data:
          - OCR failure modes: OCR_FAILURE_MODES.md
  - Experiments:
      - Solving:
          - decider-0.8b vs the baseline: experiments/2026-11-decider-0.8b.md
      - Figure problems:
          - Qwen3.5 0.8B with the image: experiments/2026-11-vision-txto-no.md
          - Heuristics, no model: experiments/2026-11-txto-no-heuristics.md
          - decider-2b-vision on logic: experiments/2026-11-decider-2b-vision-figure-logic.md
          - InternVL3.5-1B vs decider-2b: experiments/2026-11-internvl35-1b-vs-decider-2b-vision-txto-no.md
      - Reading the options:
          - OCR text vs annotation: experiments/2026-11-ocr-text-vs-annotation.md
          - Tesseract vs PP-OCR: experiments/2026-11-tesseract-text-only.md
          - PP-FormulaNet: experiments/2026-11-ppformulanet.md
          - Option crops with OpenCV: experiments/2026-11-option-crops-opencv.md
          - Checked across languages: experiments/2026-11-option-extraction-consensus.md
          - Label-anchored boxes: experiments/2026-11-option-boxes-intermediate-rec.md
      - Intent router:
          - How we made the messages: experiments/2026-11-router-messages-method.md
          - Round 1: experiments/2026-11-router-bakeoff.md
          - Round 2: experiments/2026-11-router-bakeoff-2.md
          - Conclusion for 0.8B: experiments/2026-11-router-0.8b-conclusion.md
          - "Round 3: decider-2b": experiments/2026-11-router-bakeoff-3.md
  - Challenge:
