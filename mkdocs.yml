site_name: Santolina tutor
site_description: Math on the Edge copilot for the Arduino UNO Q (Qualcomm challenge)
docs_dir: docs
site_dir: site  # ignored by .gitignore (/site)
dev_addr: 127.0.0.1:8001  # 8000 is the board explorer (docs/BOARD_SETUP.md)

# The menu is in reading order. Add each new page here (see the docs-site skill).
nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - 1. Set up the board: BOARD_SETUP.md
      - 2. Deploy the copilot: how-to/deploy-copilot-on-board.md
      - 3. Run the student app: how-to/use-student-app.md
      - 4. Answer and score problems: how-to/use-copilot-on-board.md
      - 5. Run the teacher app: how-to/run-teacher-app.md
  - How-to guides:
      - how-to/index.md
      - The board:
          - Back up and restore a board: how-to/back-up-and-restore-a-board.md
          - Time a 2B model: how-to/time-2b-model-on-board.md
      - Solvers:
          - Try the prior solver: how-to/try-prior-solver.md
          - Install decider-0.8b: how-to/install-decider-0.8b.md
      - The tutor:
          - Use decider-2b as router: how-to/use-decider-2b-router.md
      - Data and research:
          - Read the answer options: OPTION_READER_GUIDE.md
          - Extract papers with MinerU: how-to/mineru-ocr-papers.md
  - Experiments:
      - experiments/index.md
      - "Reason: predict.py":
          - Solving the problem:
              - experiments/solving/index.md
              - decider-0.8b vs the baseline: experiments/2026-11-decider-0.8b.md
          - Figure problems:
              - experiments/figure-problems/index.md
              - Qwen3.5 0.8B with the image: experiments/2026-11-vision-txto-no.md
              - decider-2b-vision on figure logic: experiments/2026-11-decider-2b-vision-figure-logic.md
              - InternVL3.5-1B vs decider-2b: experiments/2026-11-internvl35-1b-vs-decider-2b-vision-txto-no.md
              - Heuristics, no model: experiments/2026-11-txto-no-heuristics.md
          - Reading the options:
              - experiments/option-reading/index.md
              - OCR failure modes: OCR_FAILURE_MODES.md
              - OCR text vs annotation: experiments/2026-11-ocr-text-vs-annotation.md
              - PP-FormulaNet: experiments/2026-11-ppformulanet.md
              - Checked across languages: experiments/2026-11-option-extraction-consensus.md
              - Tesseract vs PP-OCR: experiments/2026-11-tesseract-text-only.md
              - Option crops with OpenCV: experiments/2026-11-option-crops-opencv.md
              - Label-anchored boxes: experiments/2026-11-option-boxes-intermediate-rec.md
      - "Teach: student app":
          - Intent router:
              - experiments/intent-router/index.md
              - How we made the messages: experiments/2026-11-router-messages-method.md
              - Round 1: experiments/2026-11-router-bakeoff.md
              - Round 2: experiments/2026-11-router-bakeoff-2.md
              - Conclusion for 0.8B: experiments/2026-11-router-0.8b-conclusion.md
              - "Round 3: decider-2b": experiments/2026-11-router-bakeoff-3.md
              - First classifier prompt (superseded): TOOL_CALLER_PROMPT.md
  - Reference:
      - reference/index.md
      - The board:
          - UNO Q board reference: UNO_Q_BOARD_REFERENCE.md
          - Board limits (interactive): GUIA_RESTRICCIONES_UNOQ.html
          - LED matrix design (Spanish): LED_MATRIX_DESIGN.md
          - Board data contract: reference/board-data-contract.md
      - The tutor:
          - Tutor response types: reference/tutor-response-types.md
          - "Why the tutor answers this way": explanation/tutor-response-types-evidence.md
          - Tutor response policy (proposal): explanation/tutor-response-policy.md
          - "Student data and privacy": explanation/student-data-privacy.md
      - Models:
          - models/index.md
          - The tutor fine-tune: models/qwen35-tutor.md
          - decider-2b-vision: models/decider-2b-vision.md
          - InternVL3.5-1B: models/internvl3.5-1b.md
  - Challenge:
      - What the challenge asks: GOAL_MUSTS.md
      - Practice set and hidden test: PRACTICE_SET.md
      - Challenge context: CHALLENGE_CONTEXT.md
      - Setup video summary: RESUMEN_QUALCOMM_UNO_Q.md
  - Research:
      - Paper vault:
          - Vault index: vault/papers/README.md
          - Questions across folders: vault/papers/_junctions.md
      - Topics:
          - Benchmarks: vault/papers/benchmarks/_synthesis.md
          - Surveys and model reports: vault/papers/surveys/_synthesis.md
          - Inference on the board: vault/papers/inference/_synthesis.md
          - Quantization: vault/papers/quantization/_synthesis.md
          - Pruning: vault/papers/pruning/_synthesis.md
          - Fine-tuning and distillation: vault/papers/finetuning_distillation/_synthesis.md
          - Tutoring and pedagogy: vault/papers/tutoring_pedagogy/_synthesis.md
          - Jev decision models: vault/papers/jev/_synthesis.md
  - Team:
      - Develop the project: DEVELOPING.md
      - Skills guide (interactive): SKILLS_GUIDE.html
      - Review status: review/index.md

exclude_docs: |
  .gitkeep
  vault/.obsidian/
  vault/.trash/
  vault/papers/**/parsed/
  *.pdf
  vault/papers/download.sh
  vault/papers/papers.tsv
  UPC Datathon*.txt
  review/status.yml
  review/findings/

theme:
  name: material
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs        # one tab per top-level section (the docs structure)
    - navigation.path        # breadcrumbs above the page title
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  # The mermaid fence stays: docs/vault/papers/_junctions.md and docs/models/qwen35-tutor.md use it.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - abbr
  - pymdownx.snippets
  - footnotes
  - def_list
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
