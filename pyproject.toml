[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "santolina_tutor"
version = "0.0.1"
description = "Soluci\u00f3 del repte de Qualcomm"
authors = [
  { name = "Eki Gonzalez Flamarique" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pyarrow",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["santolina_tutor"]
include = ["pyproject.toml", "santolina_tutor/**/*.py", "classroom/**/*.py", "student_app/**/*.py", "teacher_app/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.flake8-bugbear]
# FastAPI and typer declare parameters with calls in defaults: that is their API.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["santolina_tutor", "classroom", "student_app", "teacher_app"]
force-sort-within-sections = true

[dependency-groups]
docs = [
    "mkdocs<2",
    "mkdocs-material>=9.8.1",
]
ocr = [
    "mineru[core]==3.4.5",
]
teacher = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pytest>=9.2.0",
    "python-multipart>=0.0.33",
    "segno>=1.6.6",
    "uvicorn>=0.54.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
