<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ S.app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/chart.umd.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">{{ S.app_name }}</a>
    <nav>
      <a href="/">{{ S.nav_dashboard }}</a>
      <a href="/students">{{ S.nav_students }}</a>
      <a href="/groups">{{ S.nav_groups }}</a>
      <a href="/boards">{{ S.nav_boards }}</a>
      <a href="/packs">{{ S.nav_packs }}</a>
      <a href="/unassigned">{{ S.nav_unassigned }}</a>
    </nav>
  </header>
  <section class="connected" hx-get="/fragments/connected" hx-trigger="load, every 2s" hx-swap="innerHTML">
  </section>
  <main>
    {% if msg %}<p class="flash ok">{{ msg }}</p>{% endif %}
    {% if err %}<p class="flash err">{{ err }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
