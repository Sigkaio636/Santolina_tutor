# vis-design seed decision: Two or three sets as a Venn diagram with counts
schema_version: 1
id: set-overlap--venn-two-or-three
status: declared
title: Two or three sets as a Venn diagram with counts
problem:
  archetype: set-overlap
  catalog_functions:
  - concepts
  - relationships
  statement: How do two or three {sets} overlap?
  mode: explanatory
  domain_examples:
  - students in two courses
  - patients with two conditions
  - users of two apps
user:
  profile: general-public
  modifiers: []
tasks:
  why:
    goal: present
    search: lookup
    query: identify
  low_level:
  - retrieve-value
  - gist
  temporal: []
  shneiderman:
  - overview
data:
  dataset_type: table
  keys:
  - role: category
    type: categorical
    cardinality: few
  values:
  - role: measure
    type: quantitative
    semantics: count
  items: tiny
constraints:
- few-categories-only
solution:
  idiom: venn_diagram
  family: set
  mark: area
  encodings:
  - attribute: category
    channel: containment
  - attribute: measure
    channel: area
    scale: linear
    note: approximate
  derived_data:
  - count per region
  ordering: n/a
  color:
    purpose: distinguish
    palette_type: qualitative
    suggested:
    - okabe-ito
    max_hues: 3
    cvd_safe: true
    second_cue: direct label
  text:
    title: takeaway
    axis_units: true
    direct_labels: true
    annotations:
    - counts printed in each region
    source_line: true
  interaction:
    level: none
    default_state_answers_task: true
    intents: []
  layout:
    small_multiples: false
    facet_by: null
    aspect: square
  rejected_alternatives:
  - idiom: bar_chart
    reason: for 2–3 sets the Venn shows membership logic faster
    rule: PUR-02
  validation:
    stage3_checks:
    - EXP-07
    - EFF-02
    critique_skill: optional
  library_notes:
    altair: 'not native: draw circles with mark_arc or use an image'
    matplotlib: matplotlib_venn
    plotly: shapes + annotations
rationale: With ≤3 sets the overlap logic reads instantly and printed counts carry the values that areas cannot.
confidence: medium
provenance:
  origin: seed
  author: vis-design
  created: '2026-11-07'
  updated: '2026-11-07'
  times_used: 0
  last_used: null
  supersedes: null
  sources:
  - Munzner 2014
  - Wilke 2019
