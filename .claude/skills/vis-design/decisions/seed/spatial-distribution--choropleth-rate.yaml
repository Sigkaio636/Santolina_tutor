# vis-design seed decision: A rate per region as a choropleth
schema_version: 1
id: spatial-distribution--choropleth-rate
status: declared
title: A rate per region as a choropleth
problem:
  archetype: spatial-distribution
  catalog_functions:
  - location
  statement: How does {measure} vary across {region}?
  mode: explanatory
  domain_examples:
  - unemployment rate by province
  - cases per 100k by district
  - burned share of forest by county
user:
  profile: general-public
  modifiers: []
tasks:
  why:
    goal: present
    search: locate
    query: identify
  low_level:
  - find-extremum
  - cluster
  - gist
  temporal: []
  shneiderman:
  - overview
  - details-on-demand
data:
  dataset_type: geometry
  keys:
  - role: location
    type: geo-code
    cardinality: many
  values:
  - role: measure
    type: quantitative
    semantics: rate
    derived: true
    derivation: value / population or area
  items: small
constraints: []
solution:
  idiom: choropleth
  family: map-choropleth
  mark: geoshape
  encodings:
  - attribute: location
    channel: position-x
    scale: nominal
    note: geometry
  - attribute: measure
    channel: color-luminance
    scale: sequential
    classes: 5
  derived_data:
  - rate per region (normalised); class breaks by quantiles, stated
  ordering: n/a (geographic)
  color:
    purpose: encode-value
    palette_type: sequential
    suggested:
    - viridis
    - blues
    cvd_safe: true
  text:
    title: takeaway
    axis_units: true
    direct_labels: false
    annotations:
    - top region labelled
    - class breaks in legend
    source_line: true
  interaction:
    level: optional
    default_state_answers_task: true
    intents:
    - abstract-elaborate
  layout:
    small_multiples: false
    facet_by: null
    aspect: square
  rejected_alternatives:
  - idiom: bubble_map
    reason: overlap in dense regions
    rule: EFF-16
  - idiom: bar_chart
    reason: loses the spatial pattern; kept as a companion for exact ranking
    rule: PUR-02
  validation:
    stage3_checks:
    - EXP-12
    - COL-02
    - EXP-17
    - IDM-MAP
    critique_skill: optional
  library_notes:
    altair: mark_geoshape with lookup to a TopoJSON
    matplotlib: geopandas plot or Basemap; needs a geometry file
    plotly: px.choropleth with geojson
rationale: Spatial clusters are only visible on a map; normalising to a rate and classing the colors keeps large
  regions from dominating.
confidence: high
provenance:
  origin: seed
  author: vis-design
  created: '2026-11-07'
  updated: '2026-11-07'
  times_used: 0
  last_used: null
  supersedes: null
  sources:
  - Munzner 2014
  - Wilke 2019
