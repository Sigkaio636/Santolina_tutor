# vis-design seed decision: Eight to thirty series over time as small multiples for a general reader
schema_version: 1
id: trend-many-series--small-multiples-public
status: declared
title: Eight to thirty series over time as small multiples for a general reader
problem:
  archetype: trend-many-series
  catalog_functions:
  - data-over-time
  - patterns
  statement: How has {measure} per {category} evolved over {time}, shown to a general audience?
  mode: explanatory
  domain_examples:
  - cases per region per week
  - sales per branch per month
  - enrolment per programme per year
user:
  profile: general-public
  modifiers: []
tasks:
  why:
    goal: present
    search: browse
    query: compare
  low_level:
  - compare
  - trend
  - find-extremum
  temporal:
  - pattern
  - rate-of-change
  shneiderman:
  - overview
data:
  dataset_type: table
  keys:
  - role: time
    type: temporal
    cardinality: many
    grain: month
  - role: category
    type: categorical
    cardinality: some
  values:
  - role: measure
    type: quantitative
    semantics: amount
  items: small
constraints: []
solution:
  idiom: small_multiples
  family: small-multiples
  mark: line
  encodings:
  - attribute: time
    channel: position-x
    scale: temporal
    shared: true
  - attribute: measure
    channel: position-y
    scale: linear
    shared: true
    zero: true
  - attribute: category
    channel: position-y
    scale: ordinal
    note: one panel per category
  derived_data:
  - aggregate per (period, category); panels ordered by total
  ordering: panels by total descending, 4–6 columns
  color:
    purpose: highlight
    palette_type: neutral-accent
    suggested:
    - '#8c8c8c'
    - '#0072b2'
    cvd_safe: true
    second_cue: direct label
  text:
    title: takeaway
    axis_units: true
    direct_labels: true
    annotations:
    - panel titles with last value
    source_line: true
  interaction:
    level: none
    default_state_answers_task: true
    intents: []
  layout:
    small_multiples: true
    facet_by: category
    aspect: wide
  rejected_alternatives:
  - idiom: line_graph
    reason: spaghetti
    rule: IDM-LINE
  - idiom: heatmap
    reason: general readers need the familiar line shape
    rule: EFF-17
  validation:
    stage3_checks:
    - SCL-08
    - CMP-05
    - IDM-LINE
    critique_skill: optional
  library_notes:
    altair: facet with shared scales
    matplotlib: subplots sharex sharey
    plotly: px.line facet_col facet_col_wrap
rationale: Familiar line panels with shared scales let a general reader compare shapes; the heatmap is reserved
  for expert readers or more than ~30 series.
confidence: high
provenance:
  origin: seed
  author: vis-design
  created: '2026-11-07'
  updated: '2026-11-07'
  times_used: 0
  last_used: null
  supersedes: null
  sources:
  - Munzner 2014
  - Wilke 2019
